name: Tests

on:
  push:
    branches: [main]
  pull_request:

# superseded runs are cancelled — pushes in quick succession cost one run
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Qt runtime libraries (offscreen)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q PySide6 qasync cryptography reportlab \
            pytest pytest-asyncio

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q --tb=short
